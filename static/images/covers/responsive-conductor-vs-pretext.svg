<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#2d2233"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- wide header bar at full width -->
  <g opacity="0.95">
    <rect x="80" y="150" width="1040" height="70" rx="10" fill="#5865f2"/>
    <rect x="110" y="172" width="220" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="360" y="172" width="420" height="26" rx="6" fill="#ffffff" opacity="0.35"/>
    <rect x="810" y="172" width="120" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="960" y="172" width="120" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- same bar, squeezed narrower: controls keep priority order, middle one truncates -->
  <g opacity="0.95">
    <rect x="80" y="290" width="640" height="70" rx="10" fill="#8a63f2"/>
    <rect x="110" y="312" width="180" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="310" y="312" width="140" height="26" rx="6" fill="#ffffff" opacity="0.35"/>
    <rect x="470" y="312" width="90" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="580" y="312" width="90" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- narrowest: low-priority control drops entirely -->
  <g opacity="0.95">
    <rect x="80" y="430" width="360" height="70" rx="10" fill="#b06bd6"/>
    <rect x="110" y="452" width="140" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
    <rect x="270" y="452" width="140" height="26" rx="6" fill="#ffffff" opacity="0.85"/>
  </g>

  <text x="80" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="600">
    A layout that knows what to drop first
  </text>
</svg>
