<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#2d2233"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint oversized wordmark letter as background texture -->
  <text x="640" y="520" fill="#ffffff08" font-family="system-ui, -apple-system, sans-serif" font-size="640" font-weight="800">M</text>

  <clipPath id="avatarClip">
    <rect x="140" y="235" width="150" height="150" rx="24"/>
  </clipPath>
  <rect x="140" y="235" width="150" height="150" rx="24" fill="#00000033"/>
  <image href="/images/logo.jpg" x="140" y="235" width="150" height="150" clip-path="url(#avatarClip)"/>

  <text x="320" y="300" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700">
    blog.delgaudio.dev
  </text>
  <text x="320" y="345" fill="#b9b6c9" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">
    Notes on shipping software
  </text>

  <line x1="140" y1="415" x2="1060" y2="415" stroke="#ffffff22" stroke-width="1"/>
  <text x="140" y="465" fill="#8f8ca6" font-family="system-ui, -apple-system, sans-serif" font-size="22">
    Mike DelGaudio
  </text>
</svg>
