baseURL: https://blog.delgaudio.dev
languageCode: en-us
title: mike's blog
copyright: "Mike DelGaudio"

# Theme is supplied via Hugo Modules (see `module:` below)
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

# SEO basics
enableRobotsTXT: true

# No categories/tags listing pages
disableKinds:
  - taxonomy
  - term

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

# Image processing defaults
imaging:
  resampleFilter: lanczos
  quality: 85
  anchor: smart

# Output minification
minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 5
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON # required for PaperMod's search

params:
  author: Mike DelGaudio

  # Used for the homepage's <meta name="description"> and og:description
  # — pages/posts override this with their own description or summary.
  description: "Notes on shipping software — macOS, CSS, web development, and the occasional pixel-art robot. Written by Mike DelGaudio."

  # Site-wide og:image / Twitter card fallback for pages without their
  # own cover image (home, About, Archives, Search). Individual posts
  # keep using their own cover.image instead of this.
  images:
    - "/images/social/og-default.png"

  label:
    text: "blog.delgaudio.dev"
    icon: "images/logo.jpg"
    iconHeight: 26

  assets:
    theme_color: "#423"
    favicon: "/favicon.png"

  socialIcons:
    - name: github
      url: https://github.com/mikedelgaudio
    - name: linkedin
      url: https://www.linkedin.com/in/michael-delgaudio/

  ShowCodeCopyButtons: true
  ShowReadingTime: true
