baseURL: https://blog.delgaudio.dev
languageCode: en-us
title: mike's blog
copyright: "Mike DelGaudio"

# Theme is supplied via Hugo Modules (see `module:` below)
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

# SEO basics
enableRobotsTXT: true

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

# Image processing defaults
imaging:
  resampleFilter: lanczos
  quality: 85
  anchor: smart

# Output minification
minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON # required for PaperMod's search

params:
  author: Mike DelGaudio

  homeInfoParams:
    Title: mike's blog
    Content: 👋 Hey all! This blog is where I share my findings along my journey across various technologies. I'll try to keep it interesting and teach you a couple new things.

  assets:
    theme_color: "#423"
    favicon: "/favicon.png"

  socialIcons:
    - name: github
      url: https://github.com/mikedelgaudio
    - name: linkedin
      url: https://www.linkedin.com/in/michael-delgaudio/

  ShowCodeCopyButtons: true
  ShowReadingTime: true
